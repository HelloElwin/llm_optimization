# Pythia 70M SFT config
pythia-70m:
  dtype: bf16
  learning_rate: 8e-6
  model_name: EleutherAI/pythia-70m
  max_length: 520
  warmup_steps: 10
  gradient_accumulation_steps: 8
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
