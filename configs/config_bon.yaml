# Best-of-N (BoN) Configuration File
# ===================================
# This file contains configurations for running BoN experiments with all Pythia v1 models.
#
# Usage:
#   python src/bon/run_bon_pipeline.py {proxy_rm_path} [options]
#
# The proxy_rm_path should contain a {seed} placeholder, e.g.:
#   python src/bon/run_bon_pipeline.py models/rm-pythia-44m_seed{seed} --seeds 1,2,3,4,5 --ensembles


# =============================================
# Default BoN Configuration
# =============================================
defaults_bon:
  big_n: 12600  # Total number of answers for unbiased estimator
  sample_ns: "1,2,4,8,16,32,64,128,256,512,1024,2048,4096,6144,8192,12500"
  seeds: "1,2,3,4,5"  # Seeds for ensemble (cardinality = 5)
  ensembles: true
  uwo_weights: "0.5"
  gold_labelled_generations: "tlc4418/gold_labelled_gens"


# =============================================
# Pythia v1 BoN Configurations
# =============================================
# Each configuration specifies the RM path template and recommended settings
# for that model size. All models support both individual and ensemble BoN.

# Pythia 70M -> 44M RM (smallest, fastest)
bon-pythia-44m:
  rm_path_template: "models/rm-pythia-44m_seed{seed}"
  model_size: "44M"
  base_model: "EleutherAI/pythia-70m"
  description: "BoN with 44M reward models (from 70M Pythia base)"
  recommended_batch_size: 128
  # Example command:
  # python src/bon/run_bon_pipeline.py models/rm-pythia-44m_seed{seed} -o bon_pythia_44m --seeds 1,2,3,4,5 --ensembles

# Pythia 70M RM with LoRA
bon-pythia-44m-lora:
  rm_path_template: "models/rm-pythia-44m-lora_seed{seed}"
  model_size: "44M (LoRA)"
  base_model: "EleutherAI/pythia-70m"
  description: "BoN with 44M LoRA reward models"
  recommended_batch_size: 128

