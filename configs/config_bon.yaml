# =============================================
# Quick Reference: RM Training -> BoN Workflow
# =============================================
#
# Step 1: Train reward models with multiple seeds (for ensembles)
#   accelerate launch src/reward_modeling/training/trainer_rm.py \
#     --configs defaults_rm rm-pythia-{size} --rng_seed 1
#   # Repeat for seeds 2, 3, 4, 5
#
# Step 2: Run BoN with trained RMs
#   python src/bon/run_bon_pipeline.py models/rm-pythia-{size}_seed{seed} \
#     -o bon_pythia_{size} --seeds 1,2,3,4,5 --ensembles
#
# Output files:
#   - Individual RMs: runs/{output_dir}/seed{s}/bon_sampled_results.json
#   - Mean ensemble:  runs/{output_dir}/ensemble_mean/bon_sampled_results.json
#   - WCO ensemble:   runs/{output_dir}/ensemble_wco/bon_sampled_results.json
#   - UWO ensemble:   runs/{output_dir}/ensemble_uwo-{weight}/bon_sampled_results.json


# =============================================
# Model Size Reference
# =============================================
# | Base Model          | RM Size | Config Name      |
# |---------------------|---------|------------------|
# | EleutherAI/pythia-70m   | ~44M    | rm-pythia-44m    |
# | EleutherAI/pythia-160m  | ~160M   | rm-pythia-160m   |
# | EleutherAI/pythia-410m  | ~410M   | rm-pythia-410m   |
# | EleutherAI/pythia-1b    | ~1B     | rm-pythia-1b     |
# | EleutherAI/pythia-1.4b  | ~1.4B   | rm-pythia-1.4b   |
# | EleutherAI/pythia-2.8b  | ~2.8B   | rm-pythia-2.8b   |
# | EleutherAI/pythia-6.9b  | ~6.9B   | rm-pythia-6.9b   |
# | EleutherAI/pythia-12b   | ~12B    | rm-pythia-12b    |
